<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Le Camp</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Mise en page : en-tête + barre d'onglets ; la carte occupe la largeur avec un panneau de détail à droite sur ordinateur */
:root{
  --bg:#e7e3d8; --panel:#f3f0e7; --ink:#2a2620; --muted:#6b6355; --line:#cbc3b1; --accent:#7a4f2a; --gold:#a8812f;
  --fog:#a7a59d; --fog2:#bcbab2; --camp:#8a3b22; --sea:#8fb0b4;
  --t-plaine:#c9c08e; --t-foret:#77895c; --t-collines:#b39f6e; --t-montagne:#8f877b; --t-marais:#7f9786; --t-eau:#8fb0b4;
  --ok:#4e7a45; --warn:#9a6a1c; --off:#8b867c;
  --display:"IM Fell English SC",Georgia,serif; --body:Spectral,Georgia,"Times New Roman",serif;
  --shade:0,0,0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1a16; --panel:#26231d; --ink:#ebe5d6; --muted:#a39a88; --line:#3d382e; --accent:#d29a63; --gold:#d6ad55;
  --fog:#4a4740; --fog2:#56534b; --camp:#e07a52; --sea:#3c5a5e;
  --t-plaine:#8c8559; --t-foret:#4b5c3a; --t-collines:#7a6a45; --t-montagne:#615b52; --t-marais:#4f6457; --t-eau:#3c5a5e;
  --ok:#86b57a; --warn:#d6a24c; --off:#7c776d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1a16; --panel:#26231d; --ink:#ebe5d6; --muted:#a39a88; --line:#3d382e; --accent:#d29a63; --gold:#d6ad55;
  --fog:#4a4740; --fog2:#56534b; --camp:#e07a52; --sea:#3c5a5e;
  --t-plaine:#8c8559; --t-foret:#4b5c3a; --t-collines:#7a6a45; --t-montagne:#615b52; --t-marais:#4f6457; --t-eau:#3c5a5e;
  --ok:#86b57a; --warn:#d6a24c; --off:#7c776d; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1360px;margin:0 auto;padding-inline:20px}
header.top{padding-block:1.2rem .2rem;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.3rem 1.5rem}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5vw,3.2rem);margin:0;line-height:1;letter-spacing:.01em}
.maj{color:var(--muted);font-style:italic;margin:0}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin-top:.6rem}
nav.tabs .wrap{display:flex;gap:.1rem;overflow-x:auto}
nav.tabs button{font:inherit;font-size:1.02rem;background:none;border:0;color:var(--muted);padding:.65rem .85rem;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:1.2rem 3rem}
h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0}
.lede{color:var(--muted);margin:.2rem 0 0;max-width:68ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1.1rem 1.2rem;min-width:0}
.stack{display:grid;gap:1.4rem}
.empty{color:var(--muted);font-style:italic;margin:.6rem 0 0}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.35rem .7rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.pill{display:inline-block;font-size:.8rem;line-height:1.5;padding:0 .55rem;border-radius:999px;border:1px solid currentColor;white-space:nowrap}

/* ----- Carte ----- */
.mapgrid{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:960px){.mapgrid{grid-template-columns:minmax(0,1fr) 340px}}
.mapbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;height:min(78vh,820px);min-height:420px}
svg.map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
svg.map.drag{cursor:grabbing}
.hx{cursor:pointer}
.hx .s{stroke:var(--panel);stroke-width:1.6}
.hx.sel .s{stroke:var(--accent);stroke-width:3.2}
.lab{font-family:var(--body);fill:var(--ink);pointer-events:none}
.cid{font-size:7.5px;opacity:.55;text-anchor:middle}
.tier{font-size:8.5px;font-weight:600;opacity:.6;text-anchor:middle}
svg.z2 .cid{opacity:.8;font-size:6.5px} svg.z2 .tier{font-size:7px}
svg.z3 .cid{opacity:.9;font-size:5.5px} svg.z3 .tier{font-size:6px}
.rq{font-family:var(--display);font-size:22px;fill:var(--gold);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.mapctl{position:absolute;top:.6rem;left:.6rem;display:flex;flex-direction:column;gap:.3rem}
.mapctl button{width:2.2rem;height:2.2rem;background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:1.15rem;line-height:1}
.mapctl button:hover{border-color:var(--accent)}
.side{display:grid;gap:1rem;align-content:start;min-width:0}
.goto{display:flex;gap:.4rem}
.goto input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.35rem .6rem;text-transform:uppercase}
.err{color:var(--warn);font-size:.9rem;margin:.35rem 0 0;min-height:1.2em}
.meta{color:var(--muted);font-size:.92rem;margin:.15rem 0 .5rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .9rem;margin:.4rem 0;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.rumor{border-left:3px solid var(--gold);padding:.2rem 0 .2rem .8rem;margin:.8rem 0 0;font-style:italic}
.hist{margin:.6rem 0 0;padding-left:1.1rem;color:var(--muted);font-size:.9rem}
details.legend summary{cursor:pointer;font-family:var(--display);font-size:1.15rem}
.lg{display:grid;gap:.35rem;margin-top:.6rem;font-size:.92rem}
.lg span{display:flex;align-items:center;gap:.5rem}
.sw{width:1rem;height:.8rem;border-radius:2px;display:inline-block;flex:none;border:1px solid var(--line)}
.tierlist{display:grid;grid-template-columns:auto 1fr;gap:.1rem .8rem;font-size:.88rem;margin-top:.5rem;font-variant-numeric:tabular-nums}

/* ----- Listes, tables ----- */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.85rem;padding:.45rem .7rem .45rem 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.5rem .7rem .5rem 0;border-bottom:1px solid var(--line);vertical-align:top}
th button{background:none;border:0;padding:0;cursor:pointer;color:inherit;font-weight:600;display:inline-flex;gap:.3rem;align-items:center}
th button .ar{opacity:.35;font-size:.75rem}
th[aria-sort="ascending"] .ar,th[aria-sort="descending"] .ar{opacity:1;color:var(--accent)}
.rar{white-space:nowrap}
.rar::before{content:"";display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.4rem;vertical-align:1px;background:currentColor}
.r-c{color:var(--muted)} .r-u{color:var(--ok)}
td a{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:end;margin:1rem 0}
.filters label{display:grid;gap:.2rem;font-size:.85rem;color:var(--muted)}
.filters select,.filters input{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.35rem .6rem;color:var(--ink);min-width:12rem}
.count{color:var(--muted);font-size:.9rem;margin-left:auto}
.cards{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.rcard{display:grid;gap:.4rem}
.rcard .case{font-family:var(--display);font-size:1.3rem}
.npc{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.npc .role{color:var(--muted);font-size:.85rem;margin:0}
.treasure{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.treasure .amt{font-family:var(--display);font-size:clamp(3rem,7vw,4.2rem);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.treasure .unit{font-family:var(--display);font-size:1.4rem;color:var(--gold)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{color:var(--ok)} .minus{color:var(--warn)}
</style>
</head>
<body>


<header class="top wrap">
  <h1>Le Camp</h1>
  <p class="maj" id="maj">Chargement…</p>
</header>
<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button role="tab" id="t-carte" data-tab="carte" aria-selected="true">Carte</button>
    <button role="tab" id="t-rumeurs" data-tab="rumeurs" aria-selected="false">Rumeurs</button>
    <button role="tab" id="t-rapports" data-tab="rapports" aria-selected="false">Rapports de mission</button>
    <button role="tab" id="t-campement" data-tab="campement" aria-selected="false">Campement</button>
    <button role="tab" id="t-marchand" data-tab="marchand" aria-selected="false">Marchand</button>
    <button role="tab" id="t-inventaire" data-tab="inventaire" aria-selected="false">Inventaire de la guilde</button>
    <button role="tab" id="t-personnages" data-tab="personnages" aria-selected="false">Personnages</button>
  </div>
</nav>

<main class="wrap">
  <section id="p-carte" role="tabpanel" aria-labelledby="t-carte">
    <div class="mapgrid">
      <div class="mapbox">
        <svg class="map" id="map" role="group" aria-label="Carte de la frontière, 20 cases sur 20"></svg>
        <div class="mapctl">
          <button id="zin" title="Zoomer" aria-label="Zoomer">+</button>
          <button id="zout" title="Dézoomer" aria-label="Dézoomer">−</button>
          <button id="zcamp" title="Recentrer sur le camp" aria-label="Recentrer sur le camp">⌂</button>
        </div>
      </div>
      <div class="side">
        <form class="panel" id="gotoform" autocomplete="off">
          <label for="goto" class="meta" style="display:block;margin:0 0 .35rem">Aller à la case</label>
          <div class="goto"><input id="goto" placeholder="ex. J12" maxlength="3"><button class="btn" type="submit">Aller</button></div>
          <p class="err" id="gotoerr" role="status"></p>
        </form>
        <div class="panel" id="info" aria-live="polite"></div>
        <details class="panel legend" id="legend">
          <summary>Légende</summary>
          <div class="lg" id="lg"></div>
        </details>
      </div>
    </div>
  </section>
  <section id="p-rumeurs" role="tabpanel" aria-labelledby="t-rumeurs" hidden></section>
  <section id="p-rapports" role="tabpanel" aria-labelledby="t-rapports" hidden></section>
  <section id="p-campement" role="tabpanel" aria-labelledby="t-campement" hidden></section>
  <section id="p-marchand" role="tabpanel" aria-labelledby="t-marchand" hidden></section>
  <section id="p-inventaire" role="tabpanel" aria-labelledby="t-inventaire" hidden></section>
  <section id="p-personnages" role="tabpanel" aria-labelledby="t-personnages" hidden></section>
</main>

<script>
(function(){
"use strict";
const FILES=["carte","campement","marchand","inventaire","personnages","rapports"];
const D={};
const L="ABCDEFGHIJKLMNOPQRST";
const TERR={plaine:"Plaine",foret:"Forêt",collines:"Collines",montagne:"Montagne",marais:"Marais",eau:"Eau"};
const NIV={1:"1-3",2:"3-5",3:"5-7",4:"7-9",5:"9-11",6:"11-13",7:"13-15",8:"15-17",9:"17-19",10:"19-20"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fdate=s=>{try{return new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});}catch(e){return s;}};
const nf=new Intl.NumberFormat("fr-FR");

/* ---------- géométrie hexagonale (pointe en haut, lignes impaires décalées) ---------- */
const S=30,R3=Math.sqrt(3),PAD=12;
const pos=id=>({c:L.indexOf(id[0]),r:parseInt(id.slice(1),10)-1});
const cid=(c,r)=>L[c]+(r+1);
const ctr=(c,r)=>({x:PAD+S*R3*(c+0.5*(r&1))+S*R3/2, y:PAD+S+S*1.5*r});
function cube(c,r){const x=c-(r-(r&1))/2;return [x,-x-r,r];}
function dist(a,b){const A=cube(a.c,a.r),B=cube(b.c,b.r);return Math.max(...[0,1,2].map(i=>Math.abs(A[i]-B[i])));}
function tierOf(id){const d=dist(pos(id),pos(D.carte.camp));return d===0?0:Math.max(1,Math.ceil(d/1.5));}
function poly(p,s){let o=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);o.push((p.x+s*Math.cos(a)).toFixed(1)+","+(p.y+s*Math.sin(a)).toFixed(1));}return o.join(" ");}
function glyph(t,p){const x=p.x,y=p.y-2,o='stroke="var(--ink)" stroke-opacity=".42" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"';
  return {plaine:`<path ${o} d="M${x-9} ${y+2}h5M${x+1} ${y-3}h7M${x-3} ${y+7}h6"/>`,
  foret:`<path ${o} d="M${x-7} ${y-5}l-4.5 10h9zM${x+5} ${y-8}l-4.5 10h9zM${x-1} ${y+1}l-4.5 10h9z"/>`,
  collines:`<path ${o} d="M${x-12} ${y+5}q6-11 12 0M${x-2} ${y+5}q7-12 14 0"/>`,
  montagne:`<path ${o} d="M${x-13} ${y+7}l8-15 5 8 4-6 9 13z"/>`,
  marais:`<path ${o} d="M${x-10} ${y+5}c3-2 5 2 8 0s5 2 8 0 5 2 5 0M${x-4} ${y+5}v-8M${x} ${y+5}v-11M${x+5} ${y+5}v-6"/>`,
  eau:`<path ${o} d="M${x-10} ${y-2}q2.5-3 5 0t5 0t5 0M${x-5} ${y+5}q2.5-3 5 0t5 0t5 0"/>`}[t]||"";}
const ICON={
  camp:(x,y)=>`<path d="M${x-9} ${y+6}l9-13 9 13zM${x} ${y-7}v13M${x-3} ${y+6}l3-5 3 5" fill="none" stroke="var(--camp)" stroke-width="1.8" stroke-linejoin="round"/>`,
  ruines:(x,y)=>`<path d="M${x-7} ${y+6}v-7q7-9 14 0v7M${x-3} ${y+6}v-5q3-3 6 0v5" />`,
  repaire:(x,y)=>`<path d="M${x-8} ${y+6}q2-13 8-13t8 13M${x-3} ${y-1}l1.5 2 1.5-2M${x+1} ${y-1}l1.5 2 1.5-2"/>`,
  donjon:(x,y)=>`<path d="M${x-7} ${y+6}v-10h14v10M${x-7} ${y-4}v-3h3v2h2v-2h4v2h2v-2h3v3M${x-2} ${y+6}v-4q2-2 4 0v4"/>`,
  grotte:(x,y)=>`<path d="M${x-9} ${y+6}q2-13 9-13t9 13M${x-4} ${y+6}q1-6 4-6t4 6"/>`,
  habitation:(x,y)=>`<path d="M${x-7} ${y+6}v-7l7-6 7 6v7zM${x-2} ${y+6}v-4h4v4"/>`,
  monument:(x,y)=>`<path d="M${x-2} ${y+7}v-12l2-3 2 3v12M${x-6} ${y+7}h12"/>`,
  camp_ennemi:(x,y)=>`<path d="M${x-8} ${y+6}l8-12 8 12zM${x} ${y-6}v12M${x} ${y-9}l5 2-5 2"/>`
};
const ICONLAB={ruines:"Ruine",repaire:"Repaire",donjon:"Donjon",grotte:"Grotte / lieu naturel",habitation:"Habitation",monument:"Monument",camp_ennemi:"Camp ennemi"};
const VBW=PAD*2+S*R3*20.5, VBH=PAD*2+S*2+S*1.5*19;
let view={x:0,y:0,w:VBW,h:VBH}, sel=null, byCase={}, lieuByCase={}, rumByCase={};

function renderMap(){
  const svg=document.getElementById("map"); let base="",over="";
  for(let r=0;r<20;r++)for(let c=0;c<20;c++){
    const id=cid(c,r),p=ctr(c,r),h=byCase[id],t=tierOf(id),lieu=lieuByCase[id],rum=rumByCase[id],isCamp=id===D.carte.camp;
    const label=`${id}, palier ${t||"camp"}${h?", "+TERR[h.terrain].toLowerCase():", inexplorée"}${lieu?", lieu "+(lieu.statut==="aperçu"?"inconnu":esc(lieu.nom)):""}${rum?", rumeur":""}`;
    base+=`<g class="hx${id===sel?" sel":""}" data-id="${id}" tabindex="-1" role="button" aria-label="${label}">`;
    base+=`<polygon class="s" points="${poly(p,S)}" fill="${h?`var(--t-${h.terrain})`:(t%2?"var(--fog)":"var(--fog2)")}"/>`;
    if(t>0) base+=`<polygon points="${poly(p,S-1)}" fill="rgba(var(--shade),${(0.015+t*0.028).toFixed(3)})" pointer-events="none"/>`;
    if(h && !lieu && !isCamp) base+=glyph(h.terrain,p);
    base+=`<text class="lab cid" x="${p.x.toFixed(1)}" y="${(p.y-S*0.55).toFixed(1)}">${id}</text>`;
    if(t>0) base+=`<text class="lab tier" x="${p.x.toFixed(1)}" y="${(p.y+S*0.78).toFixed(1)}">${t}</text>`;
    base+=`</g>`;
    if(isCamp) over+=`<g pointer-events="none"><circle cx="${p.x}" cy="${p.y}" r="13" fill="var(--panel)" stroke="var(--camp)" stroke-width="2"/>${ICON.camp(p.x,p.y)}</g>`;
    else if(lieu){
      if(lieu.statut==="aperçu") over+=`<g pointer-events="none"><circle cx="${p.x}" cy="${p.y}" r="11" fill="var(--panel)" fill-opacity=".75" stroke="var(--ink)" stroke-opacity=".6" stroke-dasharray="3 2.5" stroke-width="1.4"/><text class="lab" x="${p.x}" y="${p.y+5}" text-anchor="middle" style="font-family:var(--display);font-size:14px">?</text></g>`;
      else { const f=ICON[lieu.icone]||ICON.ruines; over+=`<g pointer-events="none"><circle cx="${p.x}" cy="${p.y}" r="12" fill="var(--panel)" stroke="var(--ink)" stroke-opacity=".5"/><g fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">${f(p.x,p.y)}</g></g>`; }
    }
    if(rum) over+=`<text class="rq" x="${(p.x+S*0.42).toFixed(1)}" y="${(p.y-S*0.12).toFixed(1)}">?</text>`;
  }
  svg.innerHTML=base+over;
  applyView();
}
function applyView(){const svg=document.getElementById("map");svg.setAttribute("viewBox",`${view.x.toFixed(1)} ${view.y.toFixed(1)} ${view.w.toFixed(1)} ${view.h.toFixed(1)}`);
  const k=VBW/view.w;svg.classList.toggle("z2",k>=1.8&&k<3.2);svg.classList.toggle("z3",k>=3.2);}
function fitBox(){const box=document.querySelector(".mapbox").getBoundingClientRect();const ar=box.width/box.height;
  let w=VBW,h=VBH; if(w/h<ar) w=h*ar; else h=w/ar; return {w,h};}
function resetView(){const f=fitBox();view={x:(VBW-f.w)/2,y:(VBH-f.h)/2,w:f.w,h:f.h};applyView();}
function zoomAt(f,px,py){const minW=VBW/5,maxW=fitBox().w;let nw=Math.min(maxW,Math.max(minW,view.w/f));const s=nw/view.w;
  view.x=px-(px-view.x)*s;view.y=py-(py-view.y)*s;view.h*=s;view.w=nw;applyView();}
function centerOn(id,k){const p=pos(id),q=ctr(p.c,p.r);const f=fitBox();const w=f.w/(k||2.6),h=f.h/(k||2.6);view={x:q.x-w/2,y:q.y-h/2,w,h};applyView();}
function svgPt(e){const svg=document.getElementById("map");const b=svg.getBoundingClientRect();return {x:view.x+(e.clientX-b.left)/b.width*view.w,y:view.y+(e.clientY-b.top)/b.height*view.h};}
function bindMap(){
  const svg=document.getElementById("map"); const ptrs=new Map(); let moved=0,last=null,pinch=null;
  svg.addEventListener("wheel",e=>{e.preventDefault();const p=svgPt(e);zoomAt(e.deltaY<0?1.2:1/1.2,p.x,p.y);},{passive:false});
  svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;last={x:e.clientX,y:e.clientY};
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);} svg.classList.add("drag");});
  svg.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const b=svg.getBoundingClientRect();
    if(ptrs.size===2&&pinch){const [a,c]=[...ptrs.values()];const d=Math.hypot(a.x-c.x,a.y-c.y);const mid={clientX:(a.x+c.x)/2,clientY:(a.y+c.y)/2};const p=svgPt(mid);zoomAt(d/pinch,p.x,p.y);pinch=d;moved+=10;return;}
    const dx=e.clientX-last.x,dy=e.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);last={x:e.clientX,y:e.clientY};
    view.x-=dx/b.width*view.w;view.y-=dy/b.height*view.h;applyView();});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)svg.classList.remove("drag");
    if(e.type==="pointerup"&&moved<6){const g=document.elementFromPoint(e.clientX,e.clientY)?.closest(".hx");if(g)select(g.dataset.id);}};
  svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
  document.getElementById("zin").onclick=()=>zoomAt(1.4,view.x+view.w/2,view.y+view.h/2);
  document.getElementById("zout").onclick=()=>zoomAt(1/1.4,view.x+view.w/2,view.y+view.h/2);
  document.getElementById("zcamp").onclick=()=>{select(D.carte.camp);centerOn(D.carte.camp,2.2);};
  window.addEventListener("resize",()=>{const f=fitBox();const cx=view.x+view.w/2,cy=view.y+view.h/2;const k=Math.max(1,VBW/view.w);view.w=f.w/k;view.h=f.h/k;view.x=cx-view.w/2;view.y=cy-view.h/2;applyView();});
  document.getElementById("gotoform").addEventListener("submit",e=>{e.preventDefault();const v=document.getElementById("goto").value.trim().toUpperCase();const err=document.getElementById("gotoerr");
    const m=/^([A-T])([1-9]|1[0-9]|20)$/.exec(v); if(!m){err.textContent="Case inconnue : utilisez une lettre de A à T et un nombre de 1 à 20, par exemple J12.";return;}
    err.textContent="";select(v);centerOn(v,2.6);});
}
function info(){
  const id=sel,h=byCase[id],t=tierOf(id),lieu=lieuByCase[id],rum=rumByCase[id],box=document.getElementById("info");
  let html=`<h2>${id===D.carte.camp?"Le campement":(lieu&&lieu.statut!=="aperçu"?esc(lieu.nom):"Case "+id)}</h2>`;
  html+=`<p class="meta">Case ${id}${t?` · palier ${t}, niveau conseillé ${NIV[t]}`:" · zone sûre"}</p><dl class="kv">`;
  html+=`<dt>Terrain</dt><dd>${h?TERR[h.terrain]:"Inexploré"}</dd>`;
  if(h&&h.session!=null) html+=`<dt>Découverte</dt><dd>${h.session===0?"Connue depuis le camp":"Session "+h.session+(h.groupe?" ("+esc(h.groupe)+")":"")}</dd>`;
  html+=`</dl>`;
  if(lieu){ if(lieu.statut==="aperçu") html+=`<p><strong>Lieu inconnu.</strong> On distingue quelque chose ici depuis le camp, mais personne n'y est encore allé.</p>`;
    else html+=`<dl class="kv"><dt>Type</dt><dd>${esc(lieu.type||"")}</dd><dt>Statut</dt><dd>${esc(lieu.statut)}</dd>${lieu.decouvert?`<dt>Découvert par</dt><dd>${esc(lieu.decouvert)}</dd>`:""}</dl><p>${esc(lieu.description||"")}</p>`; }
  if(id===D.carte.camp) html+=`<p>Le point de départ de toutes les expéditions. Voir l'onglet Campement.</p>`;
  if(rum) html+=`<div class="rumor">On raconte : « ${esc(rum.texte)} »<br><span class="meta">${fdate(rum.date)}</span></div>`;
  if(h&&h.historique&&h.historique.length) html+=`<ul class="hist">${h.historique.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if(!h&&!rum&&!lieu) html+=`<p class="meta">Personne n'en est encore revenu avec des informations.</p>`;
  box.innerHTML=html;
}
function select(id){sel=id;document.querySelectorAll(".hx.sel").forEach(g=>g.classList.remove("sel"));const g=document.querySelector(`.hx[data-id="${id}"]`);if(g)g.classList.add("sel");info();}
function legend(){
  let h=Object.keys(TERR).map(k=>`<span><i class="sw" style="background:var(--t-${k})"></i>${TERR[k]}</span>`).join("");
  h+=`<span><i class="sw" style="background:var(--fog)"></i>Inexploré</span>`;
  h+=`<span><svg width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="currentColor" stroke-dasharray="3 2"/></svg>Lieu aperçu, inconnu</span>`;
  h+=`<span><svg width="18" height="18" aria-hidden="true"><text x="5" y="15" style="font-family:var(--display);font-size:16px;fill:var(--gold)">?</text></svg>Rumeur</span>`;
  h+=`<p class="meta" style="margin:.4rem 0 0">Le chiffre en bas de chaque case est son palier de danger :</p><div class="tierlist">${Object.entries(NIV).map(([k,v])=>`<span>${k}</span><span>niveau ${v}</span>`).join("")}</div>`;
  document.getElementById("lg").innerHTML=h;
  if(matchMedia("(min-width: 960px)").matches) document.getElementById("legend").open=true;
}

/* ---------- Rumeurs, rapports ---------- */
function renderRumeurs(){
  const R=D.carte.rumeurs;
  document.getElementById("p-rumeurs").innerHTML=`<div class="stack"><div><h2>Rumeurs</h2><p class="lede">Ce que les informateurs du camp ont entendu. Toutes les rumeurs ne disent pas la vérité.</p></div>
  ${R.length?`<div class="cards">${R.map(r=>`<article class="panel rcard"><span class="case">${esc(r.case)}</span><p style="margin:0">« ${esc(r.texte)} »</p><span class="meta">${fdate(r.date)} · palier ${tierOf(r.case)}</span><div><button class="btn" data-go="${esc(r.case)}">Voir sur la carte</button></div></article>`).join("")}</div>`:`<p class="empty">Aucune rumeur pour l'instant.</p>`}</div>`;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{show("carte",true);select(b.dataset.go);centerOn(b.dataset.go,2.6);});
}
function renderRapports(){
  const R=D.rapports.rapports;
  document.getElementById("p-rapports").innerHTML=`<div class="stack"><div><h2>Rapports de mission</h2><p class="lede">Le récit public de chaque expédition, rédigé après le débrief du MJ.</p></div>
  ${R.length?R.slice().reverse().map(r=>`<article class="panel"><h3>${esc(r.titre)}</h3><p class="meta">Session ${r.session} · ${fdate(r.date)} · ${esc((r.participants||[]).join(", "))}</p><p>${esc(r.resume)}</p>${r.decouvertes?`<p><strong>Découvertes :</strong> ${esc(r.decouvertes)}</p>`:""}${r.butin?`<p><strong>Pour la guilde :</strong> ${esc(r.butin)}</p>`:""}</article>`).join(""):`<p class="empty">Aucune expédition n'est encore revenue. Le premier rapport apparaîtra ici après la première mission.</p>`}</div>`;
}

/* ---------- Campement ---------- */
function renderCamp(){
  const C=D.campement;
  document.getElementById("p-campement").innerHTML=`<div class="stack"><div><h2>Le campement</h2><p class="lede">${esc(C.description)}</p></div>
  <div class="npc">${C.pnj.map(p=>`<article class="panel"><p class="role">${esc(p.role)}</p><h3>${esc(p.nom)}</h3><p style="margin:.4rem 0 0">${esc(p.description)}</p></article>`).join("")}</div></div>`;
}

/* ---------- Marchand ---------- */
let mSort={k:"rarete",dir:1};
const RORD={"Courant":1,"Peu courant":2,"Rare":3,"Très rare":4,"Légendaire":5};
function renderMarchandShell(){
  const types=[...new Set(D.marchand.objets.map(o=>o.type))].sort((a,b)=>a.localeCompare(b,"fr"));
  const rars=[...new Set(D.marchand.objets.map(o=>o.rarete))].sort((a,b)=>RORD[a]-RORD[b]);
  document.getElementById("p-marchand").innerHTML=`<div><h2>Le marchand</h2><p class="lede">${esc(D.marchand.note)}</p></div>
  <div class="filters">
    <label for="f-q">Rechercher<input id="f-q" type="search" placeholder="Nom de l'objet"></label>
    <label for="f-type">Type<select id="f-type"><option value="">Tous les types</option>${types.map(t=>`<option>${esc(t)}</option>`).join("")}</select></label>
    <label for="f-rar">Rareté<select id="f-rar"><option value="">Toutes les raretés</option>${rars.map(t=>`<option>${esc(t)}</option>`).join("")}</select></label>
    <span class="count" id="m-count"></span>
  </div>
  <div class="panel tablewrap"><table><thead><tr>
    <th data-k="nom" aria-sort="none"><button>Objet <span class="ar">▲▼</span></button></th>
    <th data-k="type" aria-sort="none"><button>Type <span class="ar">▲▼</span></button></th>
    <th data-k="rarete" aria-sort="ascending"><button>Rareté <span class="ar">▲</span></button></th>
    <th data-k="prix" aria-sort="none" class="num"><button>Prix <span class="ar">▲▼</span></button></th>
    <th>Fiche</th></tr></thead><tbody id="m-body"></tbody></table></div>`;
  ["f-q","f-type","f-rar"].forEach(i=>document.getElementById(i).addEventListener("input",renderMarchand));
  document.querySelectorAll("#p-marchand th[data-k] button").forEach(b=>b.onclick=()=>{const k=b.parentElement.dataset.k;mSort=mSort.k===k?{k,dir:-mSort.dir}:{k,dir:1};renderMarchand();});
  renderMarchand();
}
function renderMarchand(){
  const q=document.getElementById("f-q").value.trim().toLowerCase(),ty=document.getElementById("f-type").value,ra=document.getElementById("f-rar").value;
  const val=(o,k)=>k==="rarete"?RORD[o.rarete]:k==="prix"?(o.prix??Infinity):String(o[k]).toLowerCase();
  let list=D.marchand.objets.filter(o=>(!q||o.nom.toLowerCase().includes(q))&&(!ty||o.type===ty)&&(!ra||o.rarete===ra));
  list.sort((a,b)=>{const x=val(a,mSort.k),y=val(b,mSort.k);let c=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"fr");if(!c)c=a.nom.localeCompare(b.nom,"fr");return c*mSort.dir;});
  document.querySelectorAll("#p-marchand th[data-k]").forEach(th=>{const on=th.dataset.k===mSort.k;th.setAttribute("aria-sort",on?(mSort.dir>0?"ascending":"descending"):"none");th.querySelector(".ar").textContent=on?(mSort.dir>0?"▲":"▼"):"▲▼";});
  document.getElementById("m-count").textContent=`${list.length} objet${list.length>1?"s":""}`;
  document.getElementById("m-body").innerHTML=list.length?list.map(o=>`<tr><td>${esc(o.nom)}</td><td>${esc(o.type)}</td><td><span class="rar ${o.rarete==="Courant"?"r-c":"r-u"}">${esc(o.rarete)}</span></td><td class="num">${o.prix==null?'<span class="meta">à venir</span>':nf.format(o.prix)+" po"}</td><td>${o.lien?`<a href="${esc(o.lien)}" target="_blank" rel="noopener">AideDD</a>`:""}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">Aucun objet ne correspond à ces filtres.</td></tr>`;
}

/* ---------- Inventaire ---------- */
function renderInventaire(){
  const I=D.inventaire;
  document.getElementById("p-inventaire").innerHTML=`<div class="stack">
   <div><h2>Inventaire de la guilde</h2><div class="treasure" style="margin-top:.6rem"><span class="amt">${nf.format(I.tresor)}</span><span class="unit">po au trésor</span></div><p class="lede">${esc(I.regle)}</p></div>
   <div class="panel"><h3>Coffre commun</h3>${I.coffre.length?`<div class="tablewrap"><table><thead><tr><th>Objet</th><th>Rareté</th><th>Origine</th><th>Session</th><th>Rapporté par</th><th>Attribué à</th></tr></thead><tbody>${I.coffre.map(o=>`<tr><td>${esc(o.nom)}</td><td>${esc(o.rarete)}</td><td>${esc(o.origine)}</td><td class="num">${o.session}</td><td>${esc(o.rapporte)}</td><td>${esc(o.attribue||"disponible")}</td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">Le coffre est vide. Les objets magiques rapportés des expéditions apparaîtront ici. Pour en réclamer un, écrivez dans #marchand-et-coffre.</p>`}</div>
   <div class="panel"><h3>Mouvements du trésor</h3>${I.mouvements.length?`<div class="tablewrap"><table><thead><tr><th>Session</th><th>Mouvement</th><th class="num">Montant</th></tr></thead><tbody>${I.mouvements.slice().reverse().map(m=>`<tr><td>${m.session}</td><td>${esc(m.libelle)}</td><td class="num ${m.montant<0?"minus":"plus"}">${m.montant>0?"+":"−"}${nf.format(Math.abs(m.montant))} po</td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">Aucun mouvement pour l'instant.</p>`}</div></div>`;
}

/* ---------- Personnages ---------- */
function renderPersonnages(){
  const P=D.personnages.personnages, vivants=P.filter(p=>p.statut!=="mort"), morts=P.filter(p=>p.statut==="mort");
  const st={actif:"var(--ok)",absent:"var(--warn)",retraité:"var(--off)"};
  document.getElementById("p-personnages").innerHTML=`<div class="stack"><div><h2>Personnages</h2><p class="lede">Les membres de la guilde et leur progression.</p></div>
  <div class="panel">${vivants.length?`<div class="tablewrap"><table><thead><tr><th>Nom</th><th>Joueur</th><th>Race</th><th>Classe</th><th class="num">Niveau</th><th class="num">Sessions</th><th>Statut</th></tr></thead><tbody>${vivants.map(p=>`<tr><td>${p.portrait?`<img src="${esc(p.portrait)}" alt="" width="28" height="28" style="border-radius:50%;vertical-align:middle;margin-right:.4rem;object-fit:cover">`:""}${esc(p.nom)}</td><td>${esc(p.joueur)}</td><td>${esc(p.race)}</td><td>${esc(p.classe)}</td><td class="num">${p.niveau}</td><td class="num">${p.sessions}</td><td><span class="pill" style="color:${st[p.statut]||"var(--muted)"}">${esc(p.statut)}</span></td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">Les personnages apparaîtront ici après la session 0.</p>`}</div>
  <div class="panel"><h3>Ceux qui ne sont pas revenus</h3>${morts.length?`<ul>${morts.map(p=>`<li><strong>${esc(p.nom)}</strong>, ${esc(p.race)} ${esc(p.classe)} de niveau ${p.niveau}, tombé à ${esc(p.lieu_mort||"?")} (session ${p.session_mort??"?"})</li>`).join("")}</ul>`:`<p class="empty">Personne, pour l'instant.</p>`}</div></div>`;
}

/* ---------- Onglets ---------- */
const TABS=["carte","rumeurs","rapports","campement","marchand","inventaire","personnages"];
function show(tab,push){if(!TABS.includes(tab))tab="carte";
  TABS.forEach(t=>{document.getElementById("t-"+t).setAttribute("aria-selected",t===tab?"true":"false");document.getElementById("p-"+t).hidden=t!==tab;});
  if(push){try{history.replaceState(null,"","#"+tab);}catch(e){}}
  if(tab==="carte") requestAnimationFrame(()=>{if(view.w===VBW&&view.h===VBH)resetView();});}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.tab,true)));

Promise.all(FILES.map(n=>fetch("data/"+n+".json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(n);return r.json();}).then(j=>D[n]=j)))
.then(()=>{
  D.carte.cases.forEach(h=>byCase[h.id]=h); D.carte.lieux.forEach(l=>lieuByCase[l.case]=l); D.carte.rumeurs.forEach(r=>rumByCase[r.case]=r);
  const m=D.carte.maj; document.getElementById("maj").textContent=`Mise à jour : ${m.session===0?"lancement":"session "+m.session}, ${fdate(m.date)}`;
  sel=D.carte.camp; renderMap(); bindMap(); legend(); info();
  renderRumeurs(); renderRapports(); renderCamp(); renderMarchandShell(); renderInventaire(); renderPersonnages();
  show((location.hash||"").slice(1),false); resetView(); if(location.hash.slice(1)==="carte"||!location.hash) centerOn(D.carte.camp,1.6);
  window.addEventListener("hashchange",()=>show(location.hash.slice(1),false));
})
.catch(err=>{document.getElementById("maj").textContent="";document.getElementById("info").innerHTML=`<p class="err">Impossible de charger data/${esc(err.message)}.json. Vérifiez que le dossier data est bien à côté de index.html.</p>`;});
})();
</script>
